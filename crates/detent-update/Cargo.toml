[package]
name = "detent-update"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Self-update client and verifier."
publish = false

[lints]
workspace = true

[features]
default = []
# Fixture regeneration (PLAN Phase 9 task 3): mints the synthetic trust root,
# leaf and Sigstore bundles under tests/fixtures/ with a fixed tag. Not in
# default: rcgen is only needed when re-capturing fixtures, and the committed
# fixtures are the test input. `cargo run -p detent-update --features
# fixture-gen --bin gen-fixtures` rewrites them.
fixture-gen = ["dep:rcgen", "rcgen/aws_lc_rs"]

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
time = { workspace = true }
tempfile = { workspace = true }
semver = { workspace = true }
base64 = { workspace = true }
p256 = { workspace = true }
x509-parser = { workspace = true }
webpki = { workspace = true }
rustls-pki-types = { workspace = true }
http-body-util = { workspace = true }
# rustls itself only for the fetch client's TLS configuration; hyper features
# extend the workspace entry (server side lives in detent-web).
rustls = { workspace = true, features = ["aws_lc_rs"] }
hyper = { workspace = true, features = ["client"] }
hyper-util = { workspace = true, features = ["client", "client-legacy"] }
hyper-rustls = { workspace = true }
webpki-roots = { workspace = true }
# The fetch client runs on its own current-thread runtime (the CLI is sync).
tokio = { workspace = true, features = ["rt", "net", "time"] }
rcgen = { workspace = true, optional = true, features = ["pem"] }

[dev-dependencies]
rcgen = { workspace = true, features = ["pem", "aws_lc_rs"] }
tokio-rustls = { workspace = true, features = ["aws_lc_rs"] }

[[bin]]
name = "gen-fixtures"
path = "src/bin/gen-fixtures.rs"
required-features = ["fixture-gen"]
