[package]
name = "detent-update"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Self-update client and verifier."
publish = false

[lints]
workspace = true

[features]
default = ["client"]
client = [
    "dep:http-body-util", "dep:hyper", "dep:hyper-rustls", "dep:hyper-util",
    "dep:rustls", "dep:semver", "dep:tempfile", "dep:time", "dep:tokio",
    "dep:webpki-roots",
]
# Fixture regeneration (PLAN Phase 9 task 3): mints the synthetic trust root,
# leaf and Sigstore bundles under tests/fixtures/ with a fixed tag. Not in
# default: rcgen is only needed when re-capturing fixtures, and the committed
# fixtures are the test input. `cargo run -p detent-update --features
# fixture-gen --bin gen-fixtures` rewrites them.
fixture-gen = ["dep:rcgen", "rcgen/aws_lc_rs"]

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
p256 = { workspace = true }
webpki = { workspace = true }
rustls-pki-types = { workspace = true }
x509-parser = { workspace = true }
http-body-util = { workspace = true, optional = true }
# rustls itself is only for the fetch client and health check.
rustls = { workspace = true, features = ["aws_lc_rs"], optional = true }
hyper = { workspace = true, features = ["client"], optional = true }
hyper-util = { workspace = true, features = ["client", "client-legacy"], optional = true }
hyper-rustls = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
semver = { workspace = true, optional = true }
time = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "net", "time"], optional = true }
rcgen = { workspace = true, optional = true, features = ["pem"] }

[dev-dependencies]
rcgen = { workspace = true, features = ["pem", "aws_lc_rs"] }
tokio-rustls = { workspace = true, features = ["aws_lc_rs"] }

[[bin]]
name = "gen-fixtures"
path = "src/bin/gen-fixtures.rs"
required-features = ["fixture-gen"]
