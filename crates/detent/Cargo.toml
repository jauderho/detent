[package]
name = "detent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "detent binary: clap CLI, wiring, feature gates."
publish = false

[[bin]]
name = "detent"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
mimalloc = { workspace = true }
clap = { workspace = true }
fluent-bundle = { workspace = true }
# `termios`: `detent setup`/`user add`/`user passwd` read a password from the
# controlling terminal with echo disabled (PLAN §2.6: never on argv).
rustix = { workspace = true, features = ["termios"] }
serde = { workspace = true }
serde_json = { workspace = true }
unic-langid = { workspace = true }
zeroize = { workspace = true }
# Only ever built when `web` is: `serve` runs `detent-web`'s router on a
# runtime built inside the worker (PLAN §2.6), never a process-wide one — a
tokio = { workspace = true, optional = true }
axum = { workspace = true, optional = true }

detent-core = { path = "../detent-core" }
detent-i18n = { path = "../detent-i18n" }
detent-modules = { path = "../detent-modules" }
detent-ops = { path = "../detent-ops" }
detent-platform = { path = "../detent-platform" }
detent-web = { path = "../detent-web", optional = true }
detent-acme = { path = "../detent-acme", optional = true }
detent-update = { path = "../detent-update", optional = true }
# `semver`/`time`: the running version and the age-gate clock, both only when
# the self-update feature is compiled (PLAN §2.9).
semver = { workspace = true, optional = true }
time = { workspace = true, optional = true }
detent-mcp = { path = "../detent-mcp", optional = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
# Every module is reached through the `detent-modules` registry facade (PLAN
# §2.1 dependency direction); `detent` never depends on a module crate
# directly.
module-hosts = ["detent-modules/module-hosts"]
module-resolver = ["detent-modules/module-resolver"]
module-chrony = ["detent-modules/module-chrony"]
module-mounts = ["detent-modules/module-mounts"]
module-nfs = ["detent-modules/module-nfs"]
module-samba = ["detent-modules/module-samba"]
module-dhcp = ["detent-modules/module-dhcp"]
module-network = ["detent-modules/module-network"]

web = ["dep:detent-web", "dep:tokio"]
## Embeds the built SPA from web/dist into the binary.
ui = ["web", "detent-web/ui"]

acme-dns01 = ["dep:detent-acme"]
## The networked dns-01 providers. Inert until detent-acme links an HTTPS
## client and an HMAC crate (ADR-011 cooldown), so not in `default`.
acme-dns-providers = ["acme-dns01", "detent-acme/dns-providers"]
acme-attest = ["acme-dns01"]

## Implies `web`: the post-swap restart check reads `detent.toml` through
## `detent-web`'s config and pins the listener's serving cert (`detent-web`
## already owns both), so an updater without it could not verify the restart.
update = ["dep:detent-update", "dep:semver", "dep:time", "web"]

mcp = ["dep:detent-mcp", "detent-mcp/mcp", "dep:detent-web", "dep:tokio", "dep:axum"]

init-systemd = []
init-openrc = []
init-bsdrc = []

crypto-aws-lc = []
crypto-ring = []

default = [
    "module-hosts",
    "module-resolver",
    "module-chrony",
    "module-mounts",
    "module-nfs",
    "module-samba",
    "module-dhcp",
    "module-network",
    "web",
    "acme-dns01",
    "update",
    "init-systemd",
    "crypto-aws-lc",
]
