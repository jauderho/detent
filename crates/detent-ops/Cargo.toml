[package]
name = "detent-ops"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Operation layer: typed Operations, authz hooks, audit log, commit-confirm state machine."
publish = false

[lints]
workspace = true

[dependencies]
detent-core = { path = "../detent-core" }
detent-platform = { path = "../detent-platform" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true, optional = true }

[dev-dependencies]
detent-modules = { path = "../detent-modules", features = ["module-samba"] }
detent-platform = { path = "../detent-platform", features = ["update"] }
detent-update = { path = "../detent-update", default-features = false }
proptest = { workspace = true }
tempfile = { workspace = true }

[features]
default = []
## Enables `utoipa::ToSchema` on the report types that reach an API response
## body, so `detent-web` can describe them in `docs/openapi.json`. Off by
## default: PLAN §2.1 keeps this crate front-end agnostic, and a default build
## has no utoipa in its dependency graph.
openapi = ["dep:utoipa", "detent-core/openapi", "detent-platform/openapi"]
