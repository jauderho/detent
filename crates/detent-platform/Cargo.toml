[package]
name = "detent-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "OS layer: atomic file ops, backups, privsep monitor/worker, sandboxing, service managers, host detection, shared HTTP client."
publish = false

# Cannot use `[lints] workspace = true` here: the workspace forbids unsafe_code,
# and forbid cannot be locally downgraded. This crate needs targeted unsafe
# (syscalls, sandboxing) so unsafe_code is denied instead of forbidden, which
# permits `#[allow(unsafe_code)]` on individual items backed by a `// SAFETY:`
# comment. All other lints mirror [workspace.lints] exactly.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
unsafe_code = "deny"
missing_docs = "warn"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "warn"
multiple_crate_versions = "allow"

[dependencies]
arbitrary = { workspace = true, optional = true }
detent-core = { path = "../detent-core" }
postcard = { workspace = true }
# Adds the `thread` feature on top of the workspace default (`fs`, `process`,
# `std`): `spawn::harden` calls `rustix::thread::set_no_new_privs` on Linux,
# which that module gates behind `cfg(feature = "thread")`. Additive per
# Cargo's workspace-dependency feature unification; the base feature list
# stays defined once, in the root `Cargo.toml`.
rustix = { workspace = true, features = ["thread"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true, optional = true }
xattr = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }

[features]
default = []
## Enables `arbitrary::Arbitrary` for the privsep wire types so `cargo-fuzz`
## targets can build structured `Request`/`Response` values. Mirrors
## `detent-core`'s and `detent-module-hosts`'s `fuzzing` feature.
fuzzing = ["dep:arbitrary"]
## Enables `utoipa::ToSchema` on the types that reach an API response body, so
## `detent-web` can describe them in `docs/openapi.json`. Off by default, for
## the same reason as `detent-core`'s feature of the same name.
openapi = ["dep:utoipa", "detent-core/openapi"]

[target.'cfg(target_os = "linux")'.dependencies]
caps = { workspace = true }
landlock = { workspace = true }
seccompiler = { workspace = true }
