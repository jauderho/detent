[package]
name = "detent-acme"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "ACME: dns-01 providers, device-attest-01 attestors, renewal scheduler, cert store."
publish = false

[features]
# The four networked dns-01 providers (RFC 2136, Cloudflare, acme-dns, deSEC).
# Off by default: detent-acme links no TLS client and no HMAC crate, so every
# one of them refuses at the send step. Their request building and response
# parsing are implemented and unit-tested against recorded fixtures, so this
# turns on for that -- but compiling ~1200 lines that cannot reach a server
# into the shipped binary is weight for nothing. Turn on with the transport.
dns-providers = []
# ponytail: one feature, not per-parser cfgs; the wrappers below are the whole seam.
fuzzing = []

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
# Account credential (de)serialization for the 0600 cache file.
serde_json = { workspace = true }
# ACME client (RFC 8555). Pinned exact: Phase 6 spike uses this one version;
# it defaults to aws-lc-rs, matching the workspace crypto stack (no ring).
# `time` enables Account::renewal_info (ARI, RFC 9773); `x509-parser` reads
# the AKI/serial the ARI identifier needs out of the issued chain.
instant-acme = { version = "=0.8.5", features = ["time"] }
base64 = { workspace = true }
rustls-pki-types = { workspace = true }
time = { workspace = true }
x509-parser = { workspace = true }

[dev-dependencies]
# Only for unit fixtures (an AKI-bearing chain for `ari_identifier`) and the
# #[ignore]d Pebble live test: a runtime to block on the async order flow.
# detent-acme itself stays tokio-free and rcgen-free.
rcgen = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
