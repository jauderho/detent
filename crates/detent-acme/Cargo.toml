[package]
name = "detent-acme"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "ACME: dns-01 providers, device-attest-01 attestors, renewal scheduler, cert store."
publish = false

[features]
# The four networked dns-01 providers (RFC 2136, Cloudflare, acme-dns, deSEC).
# Off by default: detent-acme links no TLS client and no HMAC crate, so every
# one of them refuses at the send step. Their request building and response
# parsing are implemented and unit-tested against recorded fixtures, so this
# turns on for that -- but compiling ~1200 lines that cannot reach a server
# into the shipped binary is weight for nothing. Turn on with the transport.
dns-providers = []

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
# Account credential (de)serialization for the 0600 cache file.
serde_json = { workspace = true }
# ACME client (RFC 8555). Pinned exact: Phase 6 spike uses this one version;
# it defaults to aws-lc-rs, matching the workspace crypto stack (no ring).
instant-acme = "=0.8.5"

[dev-dependencies]
tempfile = { workspace = true }
# Only for the #[ignore]d Pebble live test: a runtime to block on the async
# order flow. detent-acme itself stays tokio-free.
tokio = { workspace = true, features = ["rt"] }
