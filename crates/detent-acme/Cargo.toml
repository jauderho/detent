[package]
name = "detent-acme"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "ACME: dns-01 providers, device-attest-01 attestors, renewal scheduler, cert store."
publish = false

[features]
# The four networked dns-01 providers (RFC 2136, Cloudflare, acme-dns, deSEC).
# Cloudflare, acme-dns and deSEC send over the crate's TLS 1.3 client
# (src/https.rs); RFC 2136 sends TSIG-signed UPDATEs over TCP (src/tsig.rs).
# Also the dns-01 propagation check (hickory-net). Off by default until serve
# selects a provider from `[acme]`.
dns-providers = ["dep:hickory-net"]
# ponytail: one feature, not per-parser cfgs; the wrappers below are the whole seam.
fuzzing = []

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
# Account credential (de)serialization for the 0600 cache file.
serde_json = { workspace = true }
# ACME client (RFC 8555). Pinned exact: Phase 6 spike uses this one version;
# it defaults to aws-lc-rs, matching the workspace crypto stack (no ring).
# `time` enables Account::renewal_info (ARI, RFC 9773); `x509-parser` reads
# the AKI/serial the ARI identifier needs out of the issued chain.
instant-acme = { version = "=0.8.5", default-features = false, features = ["aws-lc-rs", "time"] }
base64 = { workspace = true }
# TSIG HMAC (RFC 8945) and the UPDATE message id. Already in the tree through
# rustls, instant-acme and rcgen.
aws-lc-rs = { workspace = true }
rustls-pki-types = { workspace = true }
time = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-rustls = { workspace = true }
hyper-util = { workspace = true }
rustls = { workspace = true }
webpki-roots = { workspace = true }
x509-parser = { workspace = true }
# The provider transport runs each request on a private current-thread
# runtime (src/https.rs). Already in the tree through hyper and instant-acme.
tokio = { workspace = true }
# Authoritative-nameserver queries for the dns-01 propagation check
# (src/propagation.rs). Pinned exact like instant-acme. Plain UDP and TCP DNS
# only: no DNSSEC, TLS, QUIC or HTTPS features. This is the 0.26 line of
# hickory-client, which moved into hickory-net; hickory-client 0.25.2 (the
# newest release of that name) pulls hickory-proto 0.25.2, which carries
# RUSTSEC-2026-0118 and RUSTSEC-2026-0119 (fixed in 0.26.1). ADR-011.
hickory-net = { version = "=0.26.3", default-features = false, features = ["tokio"], optional = true }

[dev-dependencies]
# Only for unit fixtures (an AKI-bearing chain for `ari_identifier`, the
# provider transport's test TLS server) and the #[ignore]d Pebble live test.
# detent-acme itself stays rcgen-free.
rcgen = { workspace = true }
tempfile = { workspace = true }
