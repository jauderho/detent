[package]
name = "detent-web"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Axum server: TLS, auth, sessions, CSRF, API v1, embedded SPA."
publish = false

[lints]
workspace = true

[dependencies]
detent-core = { path = "../detent-core" }
detent-ops = { path = "../detent-ops" }
detent-platform = { path = "../detent-platform" }

argon2 = { workspace = true }
axum = { workspace = true }
getrandom = { workspace = true }
hmac = { workspace = true }
hyper-util = { workspace = true }
rcgen = { workspace = true }
# Only pulled in by the `ui` feature (PLAN §4.2); see `src/spa.rs`.
rust-embed = { workspace = true, optional = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
toml = { workspace = true }
# `tower::Service` is implemented by hand in `server.rs` so that each
# connection can hand its peer address to the handlers (the login rate
# limiter is per-IP, PLAN §2.7). Nothing else here needs tower at run time.
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
# `docs/openapi.json` is generated by this crate's test suite and served from
# an `include_str!` constant at run time, so nothing about the document is
# needed in a release build. Keeping utoipa — and the `openapi` feature of the
# three crates whose types the document names — here rather than in
# [dependencies] is what makes that structural: the schema builders are not
# compiled into the binary at all, rather than compiled and then stripped.
utoipa = { workspace = true }
detent-core = { path = "../detent-core", features = ["openapi"] }
detent-ops = { path = "../detent-ops", features = ["openapi"] }
detent-platform = { path = "../detent-platform", features = ["openapi"] }

# Contract fuzz test (PLAN Phase 4 task 4): generate arbitrary/malformed
# bodies for each endpoint that takes one and assert 4xx, never 5xx.
arbitrary = { workspace = true }
proptest = { workspace = true }
# `tls12` is switched on for **test builds only**. Cargo unifies features per
# package across dependency kinds, so the library under `cargo test` gains TLS
# 1.2 support while `cargo build` still cannot speak it. That is exactly what
# makes `a_tls12_only_client_is_refused` meaningful: the client is capable of
# TLS 1.2 and the server still refuses it, rather than the handshake failing
# because the code was never compiled in.
rustls = { workspace = true, features = ["tls12"] }
tempfile = { workspace = true }
# `test-util` is a **test-only** feature for the same reason `tls12` is: it
# gives the session sweeper's test a paused clock, and never reaches the
# shipped binary, which does not build dev-dependencies.
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true }

[features]
default = ["crypto-aws-lc"]
# rustls provider selection (PLAN §2.2). At least one is required; when both
# are on, aws-lc-rs wins at run time so `--all-features` still builds.
crypto-aws-lc = ["rustls/aws_lc_rs", "tokio-rustls/aws_lc_rs", "rcgen/aws_lc_rs"]
crypto-ring = ["rustls/ring", "tokio-rustls/ring", "rcgen/ring"]
# Embeds `web/dist` into the binary (PLAN §2.6, §4.2). Off by default: that
# directory does not exist until Phase 5 builds it. See `src/spa.rs`.
ui = ["dep:rust-embed"]
