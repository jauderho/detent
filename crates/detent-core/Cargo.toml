[package]
name = "detent-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure: doc model, schema types, diagnostics, planning. No I/O, no async."
publish = false

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }
arbitrary = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }

[features]
default = []
## Enables `arbitrary::Arbitrary` implementations for the document primitives so
## `cargo-fuzz` targets in module crates can build structured inputs.
fuzzing = ["dep:arbitrary"]
