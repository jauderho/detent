[package]
name = "detent-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure: doc model, schema types, diagnostics, planning. No I/O, no async."
publish = false

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }
arbitrary = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }

[features]
default = []
## Enables `arbitrary::Arbitrary` implementations for the document primitives so
## `cargo-fuzz` targets in module crates can build structured inputs.
fuzzing = ["dep:arbitrary"]
## Enables `utoipa::ToSchema` on the types that reach an API response body, so
## `detent-web` can describe them in `docs/openapi.json`. Off by default: PLAN
## §2.1 keeps this crate front-end agnostic, and a default build has no utoipa
## in its dependency graph.
openapi = ["dep:utoipa"]
