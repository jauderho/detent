[package]
name = "detent-module-resolver"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Resolver module: /etc/resolv.conf, systemd-resolved, unbound."
publish = false

[lints]
workspace = true

[dependencies]
detent-core = { path = "../../detent-core" }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
arbitrary = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }

[features]
default = []
## Enables `arbitrary::Arbitrary` for the model types so `cargo-fuzz` targets can
## build structured edits. Mirrors `detent-core`'s `fuzzing` feature.
fuzzing = ["dep:arbitrary", "detent-core/fuzzing"]
