[package]
name = "detent-module-nfs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "NFS module: /etc/exports and /etc/exports.d."
publish = false

[lints]
workspace = true

[dependencies]
detent-core = { path = "../../detent-core" }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
arbitrary = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }

[features]
default = []
## Enables `arbitrary::Arbitrary` for `Client`/`Export`/`Model` so `cargo-fuzz`
## targets can build structured edits. Mirrors `detent-core`'s `fuzzing` feature.
fuzzing = ["dep:arbitrary", "detent-core/fuzzing"]
