[package]
name = "xbuild"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
publish = false

[features]
default = ["crypto-aws-lc"]
crypto-aws-lc = ["rustls/aws-lc-rs", "hyper-rustls/aws-lc-rs", "instant-acme/aws-lc-rs", "rcgen/aws_lc_rs"]
update-sigstore = ["dep:sigstore"]
crypto-ring = ["rustls/ring", "hyper-rustls/ring", "instant-acme/ring", "rcgen/ring"]

[dependencies]
argon2 = "0.6.0"
axum = "0.8.9"
clap = { version = "4.6.6", features = ["derive"] }
hyper-rustls = { version = "0.27.9", default-features = false, features = ["http2", "webpki-roots"] }
instant-acme = { version = "0.8.5", default-features = false, features = ["hyper-rustls"] }
mimalloc = { version = "0.1.52", features = ["secure"] }
postcard = { version = "1.1.3", features = ["alloc"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem"] }
rustls = { version = "0.23.43", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sigstore = { version = "0.14", default-features = false, features = ["verify", "rustls-tls"], optional = true }
tokio = { version = "1.53.1", features = ["rt", "net", "time", "macros", "sync", "signal"] }

[target.'cfg(target_os = "linux")'.dependencies]
caps = "0.5.6"
landlock = "0.4.7"
seccompiler = "0.5.0"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
overflow-checks = true

[profile.release.package."*"]
opt-level = "z"

[workspace]
