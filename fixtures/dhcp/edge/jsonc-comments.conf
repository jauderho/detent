// hand-made edge fixture: JSONC comment styles in a Kea DHCPv4 file
/* block comment
   spanning lines */
{ // comment after the brace
  "Dhcp4": {
    "interfaces-config": { /* inline */ "interfaces": [ "eth0" /* trailing */ ] },
    // line comment between members
    "valid-lifetime": 3600,
    "subnet4": [
      {
        "id": 1,
        "subnet": "192.168.1.0/24",
        "pools": [ { "pool": "192.168.1.100 - 192.168.1.200" } ]
      }
    ]
  } /* comment before the close */
}
