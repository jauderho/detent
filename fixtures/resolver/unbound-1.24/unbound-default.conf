# /etc/unbound/unbound.conf — NLnetLabs unbound 1.24 stock file, trimmed to
# the clauses this module models plus the comments 1.24 ships around them.
server:
    # verbosity: 1
    # interface: 0.0.0.0
    qname-minimisation: yes
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes
    aggressive-nsec: yes
    hide-identity: yes
    hide-version: yes

forward-zone:
    name: "."
    forward-tls-upstream: yes
    forward-addr: 9.9.9.9@853#dns.quad9.net
    forward-addr: 149.112.112.112@853#dns.quad9.net
