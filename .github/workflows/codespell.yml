name: Codespell

# Documentation:
# https://help.github.com/en/articles/workflow-syntax-for-github-actions

# Start the job on all push #
on:
  push:
    branches:
    - main
    - master
  # A pull request that touches only the skipped paths below has nothing to
  # check. This is not a required check (CI gate is), so a workflow-level
  # filter is safe.
  pull_request:
    paths-ignore:
      - fuzz/corpus/**
      - web/bun.lock
      - Cargo.lock
  workflow_dispatch:

#concurrency:
#  group: ${{ github.workflow }}
#  cancel-in-progress: true

permissions: read-all

# Set the Job #
jobs:
  build:
    name: Codespell
    # Set the agent to run on
    runs-on: ubuntu-26.04

    # Load all steps #
    steps:
      # Checkout the code base #
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >
            github.com:443
            pypi.org:443
            files.pythonhosted.org:443
          
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Run Linter against code base #
      # Run from PyPI, not actions-codespell: that action builds a Docker
      # image from Docker Hub when the job starts, and the anonymous pull
      # limit failed this job.
      - name: Codespell
        run: >-
          pipx run --spec codespell==2.4.3 codespell
          --check-filenames
          --ignore-words .codespellignore
          --skip "$SKIP"
        env:
          # Fuzz corpora are generated byte soup, and lockfiles are vendored.
          # Neither is prose, so spell-checking them only produces noise.
          # The translations other than en-US and en-GB are not English, so the English
          # dictionary flags ordinary words ("ist", "oder", "Modul").
          SKIP: ./fuzz/corpus,./web/bun.lock,./spikes/xbuild/Cargo.lock,./Cargo.lock,*.pem,./locales/bn-BD,./locales/de-DE,./locales/es-ES,./locales/fr-FR,./locales/hi-IN,./locales/ja-JP,./locales/pt-BR,./locales/ru-RU,./locales/zh-CN,./locales/zh-TW
