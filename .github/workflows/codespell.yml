name: Codespell

# Documentation:
# https://help.github.com/en/articles/workflow-syntax-for-github-actions

# Start the job on all push #
on:
  push:
    branches:
    - main
    - master
  pull_request:
  workflow_dispatch:

#concurrency:
#  group: ${{ github.workflow }}
#  cancel-in-progress: true

permissions: read-all

# Set the Job #
jobs:
  build:
    name: Codespell
    # Set the agent to run on
    runs-on: ubuntu-26.04

    # Load all steps #
    steps:
      # Checkout the code base #
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >
            github.com:443
            pypi.org:443
            files.pythonhosted.org:443
          
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Run Linter against code base #
      # Run from PyPI, not actions-codespell: that action builds a Docker
      # image from Docker Hub when the job starts, and the anonymous pull
      # limit failed this job.
      - name: Codespell
        run: >-
          pipx run --spec codespell==2.4.3 codespell
          --check-filenames
          --ignore-words .codespellignore
          --skip "$SKIP"
        env:
          # Fuzz corpora are generated byte soup, and lockfiles are vendored.
          # Neither is prose, so spell-checking them only produces noise.
          # The de and ja translations are not English, so the English
          # dictionary flags ordinary words ("ist", "oder", "Modul").
          SKIP: ./fuzz/corpus,./web/bun.lock,./spikes/xbuild/Cargo.lock,./Cargo.lock,*.pem,./locales/de-DE,./locales/ja-JP
