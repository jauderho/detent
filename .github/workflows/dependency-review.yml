name: 'Dependency Review'
on:
  # Only a change to a dependency manifest, a lockfile or a workflow (actions
  # are dependencies) can add a dependency. Not a required check.
  pull_request:
    paths:
      - '**/Cargo.toml'
      - Cargo.lock
      - web/package.json
      - web/bun.lock
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-26.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            api.deps.dev:443
            api.securityscorecards.dev:443

      - name: 'Checkout Repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        
      - name: 'Dependency Review'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
