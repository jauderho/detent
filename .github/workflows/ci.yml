name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: every job here checks out, builds, tests, and (in the
# coverage job) uploads an artifact. None of that needs more than read access
# to the repository contents, and `read-all` also grants read on issues,
# packages, deployments and the rest.
permissions:
  contents: read

env:
  # `dtolnay/rust-toolchain` declares `toolchain` as a *required* input and
  # hard-fails when it is empty, so every job has to name a version. Kept here
  # rather than in seven `with:` blocks, and checked against
  # rust-toolchain.toml by the "toolchain pin matches" step in the `rust` job.
  RUST_TOOLCHAIN: "1.98.0"

jobs:
  rust:
    name: Rust (fmt, clippy, test, feature matrix)
    runs-on: ubuntu-26.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Toolchain pin matches rust-toolchain.toml
        run: |
          pinned=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          if [[ "$pinned" != "${RUST_TOOLCHAIN}" ]]; then
            echo "rust-toolchain.toml pins ${pinned} but the workflow installs ${RUST_TOOLCHAIN}" >&2
            exit 1
          fi
          echo "both pin ${pinned}"

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-features

      - name: cargo build (feature set A - hosts, ring)
        run: cargo build -p detent --no-default-features --features "module-hosts,crypto-ring"

      - name: cargo build (feature set B - resolver, web, systemd init, aws-lc)
        run: cargo build -p detent --no-default-features --features "module-resolver,web,init-systemd,crypto-aws-lc"

      - name: cargo build (default features)
        run: cargo build -p detent

      # PLAN §4.2: rcgen must build with default-features = false, because its
      # defaults link `ring` even in aws-lc builds. This assertion is a no-op
      # until a rustls dependency actually exists (Phase 4); once it does,
      # `cargo tree -i ring` must be empty for the default feature set.
      # `cargo tree -i <pkg>` exits 0 whether or not the package is in the
      # graph -- an absent package is a "nothing to print" warning, not an
      # error -- so the verdict has to come from the output, not the status.
      # The earlier `! cargo tree ... -i ring` spelling failed precisely when
      # ring was correctly absent.
      - name: cargo tree -i ring (rustls builds must not pull in ring)
        run: |
          set -euo pipefail
          if ! cargo tree -e normal -p detent -i rustls 2>/dev/null | grep -q '^rustls '; then
            echo "rustls is not in this build's graph; nothing to assert"
            exit 0
          fi
          if cargo tree -e normal -p detent -i ring 2>/dev/null | grep -q '^ring '; then
            echo "::error::ring is in the dependency graph; an aws-lc-rs build must not link a second crypto stack"
            cargo tree -e normal -p detent -i ring
            exit 1
          fi
          echo "rustls present, ring absent, as required"



  acme-pebble:
    name: ACME dns-01 (Pebble + challtestsrv)
    runs-on: ubuntu-26.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build detent-acme
        run: cargo build -p detent-acme

      - name: Clippy (detent-acme)
        run: cargo clippy -p detent-acme --all-targets -- -D warnings

      # See docs/spikes/acme-le.md for the flag gotchas (-dnsserver, not
      # -dns01; pebble's DNSResolver JSON key is ignored). Both containers
      # share a bridge so pebble resolves challtestsrv by name; ports are
      # still published so the runner (and dig preflight) can reach them
      # on 127.0.0.1.
      - name: Start Pebble + challtestsrv
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y --no-install-recommends dnsutils jq
          docker network create detent-pebble 2>/dev/null || true
          mkdir -p /tmp/detent-pebble
          cat > /tmp/detent-pebble/pebble-config.json <<'EOF'
          { "pebble": { "listenAddress": "0.0.0.0:14000",
                        "managementListenAddress": "0.0.0.0:15000",
                        "certificate": "/test/certs/localhost/cert.pem",
                        "privateKey": "/test/certs/localhost/key.pem",
                        "httpPort": 5002, "tlsPort": 5001,
                        "domainBlocklist": ["blocked-domain.example"] } }
          EOF
          docker run -d --name pebble --network detent-pebble -p 14000:14000 -p 15000:15000 \
            -v /tmp/detent-pebble/pebble-config.json:/test/config/pebble-config.json \
            ghcr.io/letsencrypt/pebble:latest \
            -config /test/config/pebble-config.json -dnsserver challtestsrv:8053
          docker run -d --name challtestsrv --network detent-pebble \
            -p 8053:8053 -p 8053:8053/udp -p 8055:8055 \
            ghcr.io/letsencrypt/pebble-challtestsrv:latest \
            -defaultIPv4 "" -defaultIPv6 "" -dnsserver ":8053" \
            -http01 ":5002" -https01 ":5003" -tlsalpn01 ":5001" -management ":8055"
          docker cp pebble:/test/certs/pebble.minica.pem /tmp/detent-pebble/pebble.minica.pem
          for i in 1 2 3 4 5; do
            if curl -fsS http://127.0.0.1:8055/health >/dev/null 2>&1 && curl -fsS -k https://127.0.0.1:14000/dir >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8055/health | head -n 1 || true
          curl -fsS -k https://127.0.0.1:14000/dir | jq .newNonce 2>&1 | head -n 1 || true

      - name: Live issuance (cargo test -- --ignored)
        env:
          PEBBLE_URL: https://127.0.0.1:14000/dir
          PEBBLE_CA: /tmp/detent-pebble/pebble.minica.pem
          CHALLTESTSRV: http://127.0.0.1:8055
        run: |
          set -euo pipefail
          # Preflight: the DNS path the order flow depends on. Fail fast with logs
          # rather than letting the test time out on "DNS problem: NXDOMAIN".
          curl -fsS -X POST -d '{"host":"_acme-challenge.preflight.le.wtf.","value":"preflight"}' http://127.0.0.1:8055/set-txt
          for i in 1 2 3 4 5 6; do
            if dig @127.0.0.1 -p 8053 +short _acme-challenge.preflight.le.wtf TXT | grep -q preflight; then break; fi
            sleep 0.5
          done
          dig @127.0.0.1 -p 8053 +short _acme-challenge.preflight.le.wtf TXT || true
          curl -fsS -X POST -d '{"host":"_acme-challenge.preflight.le.wtf."}' http://127.0.0.1:8055/clear-txt || true
          # The spike test writes both the cert chain and sanity assertions (DER,
          # SAN = le.wtf). Capture its --nocapture output into the workflow log.
          cargo test -p detent-acme -- --ignored --nocapture

  rust-macos:
    name: Rust (build, test, clippy) on macOS
    runs-on: macos-latest
    steps:
      # step-security/harden-runner only supports Linux runners; omitted here.
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo build
        run: cargo build --workspace

      - name: cargo test
        run: cargo test --workspace --all-features

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  supply-chain:
    name: Supply chain (deny, audit, cooldown)
    runs-on: ubuntu-26.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

      - name: Install cargo-audit
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-audit@0.22.2

      - name: cargo audit
        run: cargo audit

      - name: Install cargo-cooldown
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-cooldown@0.3.4

      # cargo-cooldown has no `--days` CLI flag (verified against the upstream
      # README at https://github.com/dertin/cargo-cooldown): the cooldown
      # window is read from CARGO_REGISTRY_GLOBAL_MIN_PUBLISH_AGE (mirroring
      # the Cargo-native setting tracked in PLAN.md §6.4 / rust-lang/cargo#17335).
      # `check` is the guard-style subcommand that cools Cargo.lock before
      # invoking `cargo check`.
      - name: cargo cooldown check (7-day supply-chain cooldown, ADR-011)
        env:
          CARGO_REGISTRY_GLOBAL_MIN_PUBLISH_AGE: "7 days"
        run: cargo cooldown check --locked
        continue-on-error: false

  coverage:
    name: Coverage (llvm-cov + threshold gate)
    runs-on: ubuntu-26.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-llvm-cov@0.9.0

      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: coverage-merge.sh self-test
        run: scripts/coverage-merge.sh --selftest

      - name: cargo llvm-cov
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov-linux.info

      - name: Merge coverage and enforce threshold
        run: scripts/coverage-merge.sh --verbose --output merged.info lcov-linux.info

      - name: Upload lcov artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov-linux
          path: |
            lcov-linux.info
            merged.info
          retention-days: 14

  web:
    name: Web (bun, biome, bun test, i18n, build)
    runs-on: ubuntu-26.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # Bun reads bunfig.toml from the install directory only, never from a
      # parent, so the ADR-011 cooldown has to sit next to each package.json.
      # This runs before `bun install` so a misplaced config fails the job
      # rather than being papered over by an install that appears to work.
      - name: Supply-chain cooldown is in force (ADR-011)
        run: scripts/cooldown-check.sh --verbose

      - name: bun install
        working-directory: web
        run: bun install --frozen-lockfile

      - name: bun run lint
        working-directory: web
        run: bun run lint

      - name: bun run typecheck
        working-directory: web
        run: bun run typecheck

      - name: bun run test
        working-directory: web
        run: bun run test

      # PLAN §5 acceptance: 100% lines on web/src, minus the two generated
      # shadcn primitives named in scripts/coverage-check.ts.
      - name: bun run coverage:check
        working-directory: web
        run: bun run coverage:check

      - name: bun run i18n:check
        working-directory: web
        run: bun run i18n:check

      - name: bun run contrast:check
        working-directory: web
        run: bun run contrast:check

      # The Rust side already diffs docs/openapi.json against the running
      # server. This closes the other half: the TypeScript the UI is typed
      # against must be what that document generates.
      - name: bun run api:check
        working-directory: web
        run: bun run api:check

      - name: bun run build
        working-directory: web
        run: bun run build

      # Playwright runs against the built bundle via `vite preview`, with the
      # API stubbed per test (see web/e2e/api.ts) — no real binary needed.
      - name: Install Playwright chromium
        working-directory: web
        run: bunx playwright install chromium --with-deps

      - name: bun run e2e
        working-directory: web
        run: bun run e2e

  shell:
    name: Shell (shellcheck, shfmt)
    runs-on: ubuntu-26.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install shellcheck and shfmt
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt

      - name: shellcheck
        run: |
          set -euo pipefail
          mapfile -t files < <(find scripts packaging -name '*.sh' 2>/dev/null | sort)
          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "no shell scripts found"
            exit 0
          fi
          shellcheck "${files[@]}"

      - name: shfmt -d
        run: |
          set -euo pipefail
          mapfile -t files < <(find scripts packaging -name '*.sh' 2>/dev/null | sort)
          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "no shell scripts found"
            exit 0
          fi
          shfmt -d -i 2 -ci "${files[@]}"

  size:
    name: Size check
    runs-on: ubuntu-26.04
    needs: rust
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `toolchain` is a required input for this action (it has no
      # rust-toolchain.toml auto-detection of its own — verified against the
      # pinned commit's action.yml); pinned to match rust-toolchain.toml so
      # the cross target is added to the same toolchain `cargo` actually uses.
      - name: Install Rust toolchain (pinned to rust-toolchain.toml, + aarch64-musl target)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-unknown-linux-musl

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # PLAN §4.1 budgets are aarch64-unknown-linux-musl, release, stripped.
      # `cargo-zigbuild` + zig cross-compile that target from the x86_64 glibc
      # runner (docs/spikes/00-cross-build.md is the reference for both tools).
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --version 0.23.2 --locked

      # The `ui` row embeds web/dist, so the SPA has to exist before cargo
      # runs. An empty web/dist still compiles — rust-embed just embeds
      # nothing — which would silently turn that budget row into a
      # measurement of the binary without the console.
      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Build the SPA
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build

      # Four budget rows (PLAN §4.1), each built and checked against its own
      # size-baseline.json key before the next build overwrites the binary.
      - name: Build (full default features)
        run: cargo zigbuild --release -p detent --target aarch64-unknown-linux-musl

      - name: size-check (full default features)
        run: scripts/size-check.sh --verbose --key full-default-aarch64-musl target/aarch64-unknown-linux-musl/release/detent

      - name: Build (resolver + web)
        run: cargo zigbuild --release -p detent --target aarch64-unknown-linux-musl --no-default-features --features module-resolver,web,crypto-aws-lc,init-systemd

      - name: size-check (resolver + web)
        run: scripts/size-check.sh --verbose --key resolver-web-aarch64-musl target/aarch64-unknown-linux-musl/release/detent

      - name: Build (full default + embedded console)
        run: cargo zigbuild --release -p detent --target aarch64-unknown-linux-musl --features ui

      - name: size-check (full default + embedded console)
        run: scripts/size-check.sh --verbose --key full-ui-aarch64-musl target/aarch64-unknown-linux-musl/release/detent

      # No crypto feature: main.rs's provider requirement is gated on `web`,
      # so the smallest build does not have to name a TLS backend it will
      # never link. PLAN §4.1 row 3.
      - name: Build (CLI only, no web/acme/update)
        run: cargo zigbuild --release -p detent --target aarch64-unknown-linux-musl --no-default-features --features module-hosts,module-resolver,module-chrony,module-mounts,module-nfs,module-samba,module-dhcp,module-network,init-systemd

      - name: size-check (CLI only)
        run: scripts/size-check.sh --verbose --key cli-aarch64-musl target/aarch64-unknown-linux-musl/release/detent

  pins:
    name: Action pins (SHA + version comment)
    runs-on: ubuntu-26.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Every `uses:` is pinned to a 40-hex SHA with a version comment
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r line; do
            if ! [[ "$line" =~ uses:\ *[^@[:space:]]+@[0-9a-f]{40}\ +\#\ +[^[:space:]] ]]; then
              echo "unpinned or uncommented: $line"
              bad=1
            fi
          done < <(grep -hE '^\s*-?\s*uses:' .github/workflows/*.yml | grep -vE '^\s*#')
          exit "$bad"
