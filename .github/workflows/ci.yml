name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: every job here checks out, builds, tests, and (in the
# coverage job) uploads an artifact. None of that needs more than read access
# to the repository contents, and `read-all` also grants read on issues,
# packages, deployments and the rest.
permissions:
  contents: read

env:
  # The ubuntu-26.04 image provisions only `stable-*` (install-rust.sh:
  # `--default-toolchain=stable`); there is no versioned `1.98.1-*` dir,
  # so a versioned channel would download on first use. RUSTUP_TOOLCHAIN
  # outranks rust-toolchain.toml, forcing every cargo/rustc/rustup step
  # onto the preinstalled default with no download. The pin file stays
  # versioned for local dev; the `rust`/`size` drift steps fail closed
  # when preinstalled stable moves past it.
  RUSTUP_TOOLCHAIN: stable

jobs:
  rust:
    name: Rust (fmt, clippy, test, feature matrix)
    runs-on: ubuntu-26.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ubuntu-26.04 provisions only `stable-*` (install-rust.sh:
      # `--default-toolchain=stable`, plus clippy and rustfmt components),
      # and `RUSTUP_TOOLCHAIN: stable` (workflow env) outranks
      # rust-toolchain.toml so every step reuses it with no download. The
      # pin file stays versioned for local dev; this step fails closed
      # when preinstalled stable drifts past it. Read the default
      # *outside* the checkout: the env override does not apply there.
      - name: Preinstalled Rust matches rust-toolchain.toml
        run: |
          pinned=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          actual=$(cd "$RUNNER_TEMP" && rustup run stable rustc --version | awk '{print $2}')
          if [[ "$actual" != "$pinned" ]]; then
            echo "::error::preinstalled stable is ${actual} but rust-toolchain.toml pins ${pinned}" >&2
            exit 1
          fi
          echo "stable ${actual} matches pin"
      # clippy/rustfmt are requested by rust-toolchain.toml but only rustfmt
      # is listed under the image README's "Packages"; idempotent no-op when
      # already present.
      - name: rustup component add clippy rustfmt
        run: rustup component add clippy rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test (unprivileged; privileged sandbox tests run below)
        run: cargo test --workspace --all-features -- --skip sandbox::linux::tests
      # D2': cargo itself never runs as root (root-owned target/ files broke
      # later unprivileged builds with EACCES). The test binary builds
      # unprivileged; only the binary runs under sudo.
      - name: cargo test (root sandbox tests; binary runs as root, cargo never does)
        run: |
          set -euo pipefail
          bin=$(cargo test -p detent-platform --lib --all-features --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .profile.test == true) | .executable' \
            | head -n 1)
          test -n "$bin" && test -x "$bin"
          sudo "$bin" sandbox::linux::tests --test-threads=1
      - name: Install cbindgen
        uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908 # v2.87.15
        with:
          tool: cbindgen@0.29.4

      - name: cbindgen --verify (include/detent.h matches detent-ffi)
        run: cbindgen --config crates/detent-ffi/cbindgen.toml --crate detent-ffi --output include/detent.h --verify

      - name: cargo build -p detent-ffi (staticlib for the C example)
        run: cargo build -p detent-ffi

      - name: Build and run the C example
        run: |
          set -euo pipefail
          cc -I include examples/ffi-c/main.c target/debug/libdetent_ffi.a -o /tmp/ffi-c-main
          /tmp/ffi-c-main


      - name: cargo build (feature set A - hosts, ring)
        run: cargo build -p detent --no-default-features --features "module-hosts,crypto-ring"

      - name: cargo build (feature set B - resolver, web, systemd init, aws-lc)
        run: cargo build -p detent --no-default-features --features "module-resolver,web,init-systemd,crypto-aws-lc"

      - name: cargo build (default features)
        run: cargo build -p detent

      # PLAN §4.2: rcgen must build with default-features = false, because its
      # defaults link `ring` even in aws-lc builds. This assertion is a no-op
      # until a rustls dependency actually exists (Phase 4); once it does,
      # `cargo tree -i ring` must be empty for the default feature set.
      # `cargo tree -i <pkg>` exits 0 whether or not the package is in the
      # graph -- an absent package is a "nothing to print" warning, not an
      # error -- so the verdict has to come from the output, not the status.
      # The earlier `! cargo tree ... -i ring` spelling failed precisely when
      # ring was correctly absent.
      - name: cargo tree -i ring (rustls builds must not pull in ring)
        run: |
          set -euo pipefail
          if ! cargo tree -e normal -p detent -i rustls 2>/dev/null | grep -q '^rustls '; then
            echo "rustls is not in this build's graph; nothing to assert"
            exit 0
          fi
          if cargo tree -e normal -p detent -i ring 2>/dev/null | grep -q '^ring '; then
            echo "::error::ring is in the dependency graph; an aws-lc-rs build must not link a second crypto stack"
            cargo tree -e normal -p detent -i ring
            exit 1
          fi
          echo "rustls present, ring absent, as required"

  ffi-soundness:
    name: FFI soundness (Miri on detent-ffi)
    runs-on: ubuntu-26.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Nightly-only: Miri ships only on nightly, so the preinstalled
      # stable cannot supply it. `components: miri` installs the
      # interpreter alongside the toolchain.
      - name: Install nightly Rust toolchain with Miri
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly
          components: miri

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Workflow env forces RUSTUP_TOOLCHAIN=stable (outranks the
      # `rust-toolchain.toml` 1.98.1 pin), so plain `cargo` resolves to
      # stable where cargo-miri is not installed. Route through the
      # nightly toolchain explicitly.
      # No MIRIFLAGS needed: the suite passes under default isolation.
      # Covers the live hand-out set gate (`detent_free`, `split_doc`) and
      # the thread-local last-error slot — Miri caught a `ptr.sub` on
      # foreign pointers and a Cell take/put-back use-after-free here.
      - name: cargo miri test -p detent-ffi
        run: rustup run nightly cargo miri test -p detent-ffi

  ffi-semver:
    name: FFI semver (cargo-semver-checks on detent-ffi)
    runs-on: ubuntu-26.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908 # v2.87.15
        with:
          tool: cargo-semver-checks@0.50.0

      # Unpublished crates need an explicit git baseline (README FAQ "Does the
      # crate I'm checking have to be published?"): `origin/main` is the base
      # on PRs and identical to HEAD on main pushes (a no-op pass). The Rust
      # API surface is internal (`publish = false`); the C ABI side stays
      # covered by `cbindgen --verify` in the `rust` job.
      - name: cargo semver-checks on detent-ffi vs origin/main
        run: cargo semver-checks check-release -p detent-ffi --baseline-rev origin/main

  acme-pebble:
    name: ACME dns-01 (Pebble + challtestsrv)
    runs-on: ubuntu-26.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same preinstalled stable as `rust`; clippy is not listed in the
      # image README, so ensure it before the Clippy step below.
      - name: rustup component add clippy
        run: rustup component add clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build detent-acme
        run: cargo build -p detent-acme

      - name: Clippy (detent-acme)
        run: cargo clippy -p detent-acme --all-targets -- -D warnings

      # See docs/spikes/acme-le.md for the flag gotchas (-dnsserver, not
      # -dns01; pebble's DNSResolver JSON key is ignored). Both containers
      # share a bridge so pebble resolves challtestsrv by name; ports are
      # still published so the runner (and dig preflight) can reach them
      # on 127.0.0.1.
      - name: Start Pebble + challtestsrv
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y --no-install-recommends dnsutils jq
          docker network create detent-pebble 2>/dev/null || true
          mkdir -p /tmp/detent-pebble
          cat > /tmp/detent-pebble/pebble-config.json <<'EOF'
          { "pebble": { "listenAddress": "0.0.0.0:14000",
                        "managementListenAddress": "0.0.0.0:15000",
                        "certificate": "/test/certs/localhost/cert.pem",
                        "privateKey": "/test/certs/localhost/key.pem",
                        "httpPort": 5002, "tlsPort": 5001,
                        "domainBlocklist": ["blocked-domain.example"] } }
          EOF
          docker run -d --name pebble --network detent-pebble -p 14000:14000 -p 15000:15000 \
            -v /tmp/detent-pebble/pebble-config.json:/test/config/pebble-config.json \
            ghcr.io/letsencrypt/pebble@sha256:ddf230642b1a584f519f32e347de1b05a6e4c1f6c35c1863b33effeab5f78199 \
            -config /test/config/pebble-config.json -dnsserver challtestsrv:8053
          docker run -d --name challtestsrv --network detent-pebble \
            -p 8053:8053 -p 8053:8053/udp -p 8055:8055 \
            ghcr.io/letsencrypt/pebble-challtestsrv@sha256:12ce21884def456bcf9786542113949e1f19dc7738d2c70e156c2d0c38a1405b \
            -defaultIPv4 "" -defaultIPv6 "" -dnsserver ":8053" \
            -http01 ":5002" -https01 ":5003" -tlsalpn01 ":5001" -management ":8055"
          docker cp pebble:/test/certs/pebble.minica.pem /tmp/detent-pebble/pebble.minica.pem
          for i in 1 2 3 4 5; do
            if curl -fsS http://127.0.0.1:8055/health >/dev/null 2>&1 && curl -fsS -k https://127.0.0.1:14000/dir >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8055/health | head -n 1 || true
          curl -fsS -k https://127.0.0.1:14000/dir | jq .newNonce 2>&1 | head -n 1 || true

      - name: Live issuance (cargo test -- --ignored)
        env:
          PEBBLE_URL: https://127.0.0.1:14000/dir
          PEBBLE_CA: /tmp/detent-pebble/pebble.minica.pem
          CHALLTESTSRV: http://127.0.0.1:8055
        run: |
          set -euo pipefail
          # Preflight: the DNS path the order flow depends on. Fail fast with logs
          # rather than letting the test time out on "DNS problem: NXDOMAIN".
          curl -fsS -X POST -d '{"host":"_acme-challenge.preflight.le.wtf.","value":"preflight"}' http://127.0.0.1:8055/set-txt
          for i in 1 2 3 4 5 6; do
            if dig @127.0.0.1 -p 8053 +short _acme-challenge.preflight.le.wtf TXT | grep -q preflight; then break; fi
            sleep 0.5
          done
          dig @127.0.0.1 -p 8053 +short _acme-challenge.preflight.le.wtf TXT || true
          curl -fsS -X POST -d '{"host":"_acme-challenge.preflight.le.wtf."}' http://127.0.0.1:8055/clear-txt || true
          # The spike test writes both the cert chain and sanity assertions (DER,
          # SAN = le.wtf). Capture its --nocapture output into the workflow log.
          cargo test -p detent-acme -- --ignored --nocapture

  rust-macos:
    name: Rust (build, test, clippy) on macOS
    runs-on: macos-latest
    env:
      # Override workflow-wide `stable`: this job installs the pinned
      # toolchain (macOS images lag at 1.98.0) and must use it, not default.
      RUSTUP_TOOLCHAIN: "1.98.1"
    steps:
      # step-security/harden-runner only supports Linux runners; omitted here.
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # macOS images still ship 1.98.0 (Ubuntu 26.04 already has 1.98.1),
      # so this one job installs the pinned toolchain instead of using
      # the preinstalled copy. Revisit when the macOS image catches up.
      - name: Install Rust toolchain (pinned to rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: "1.98.1"
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo build
        run: cargo build --workspace

      - name: cargo test
        run: cargo test --workspace --all-features

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  supply-chain:
    name: Supply chain (deny, audit, cooldown)
    runs-on: ubuntu-26.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

      - name: Install cargo-audit
        uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908 # v2.87.15
        with:
          tool: cargo-audit@0.22.2

      - name: cargo audit
        run: cargo audit

      - name: Install cargo-cooldown
        uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908 # v2.87.15
        with:
          tool: cargo-cooldown@0.3.4

      # cargo-cooldown has no `--days` CLI flag (verified against the upstream
      # README at https://github.com/dertin/cargo-cooldown): the cooldown
      # window is read from CARGO_REGISTRY_GLOBAL_MIN_PUBLISH_AGE (mirroring
      # the Cargo-native setting tracked in PLAN.md §6.4 / rust-lang/cargo#17335).
      # `check` is the guard-style subcommand that cools Cargo.lock before
      # invoking `cargo check`.
      - name: cargo cooldown check (7-day supply-chain cooldown, ADR-011)
        env:
          CARGO_REGISTRY_GLOBAL_MIN_PUBLISH_AGE: "7 days"
        run: cargo cooldown check --locked
        continue-on-error: false

  coverage:
    name: Coverage (llvm-cov + threshold gate)
    runs-on: ubuntu-26.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # llvm-tools-preview backs `cargo llvm-cov` via rust-toolchain.toml
      # but is not in the image README; idempotent no-op when present.
      - name: rustup component add llvm-tools-preview
        run: rustup component add llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908 # v2.87.15
        with:
          tool: cargo-llvm-cov@0.9.0

      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: coverage-merge.sh self-test
        run: scripts/coverage-merge.sh --selftest

      - name: cargo llvm-cov (unprivileged tests)
        run: cargo llvm-cov --workspace --all-features --no-report -- --skip sandbox::linux::tests

      # D2': cargo itself never runs as root. The instrumented run above
      # leaves its test binaries under target/llvm-cov-target; only the
      # platform binary runs under sudo, with LLVM_PROFILE_FILE pointing
      # into the llvm-cov profile dir so `report` merges its counters.
      # Afterwards root-owned profiles are chowned back before reporting.
      - name: cargo llvm-cov (root sandbox tests; binary runs as root, cargo never does)
        run: |
          set -euo pipefail
          bin=$(ls -t target/llvm-cov-target/debug/deps/detent_platform-* | grep -v '\.' | head -n 1)
          test -n "$bin" && test -x "$bin"
          sudo env "LLVM_PROFILE_FILE=$PWD/target/llvm-cov-target/detent-%p-%m.profraw" \
            "$PWD/$bin" sandbox::linux::tests --test-threads=1
          sudo chown -R "$(id -u):$(id -g)" target

      - name: cargo llvm-cov report (merge unprivileged + root profiles)
        run: cargo llvm-cov report --lcov --output-path lcov.info

      - name: Merge coverage and enforce threshold
        run: scripts/coverage-merge.sh --verbose --output merged.info lcov.info

      - name: Upload lcov artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov-linux
          path: |
            lcov.info
            merged.info
          retention-days: 14

  web:
    name: Web (bun, biome, bun test, i18n, build)
    runs-on: ubuntu-26.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # Bun reads bunfig.toml from the install directory only, never from a
      # parent, so the ADR-011 cooldown has to sit next to each package.json.
      # This runs before `bun install` so a misplaced config fails the job
      # rather than being papered over by an install that appears to work.
      - name: Supply-chain cooldown is in force (ADR-011)
        run: scripts/cooldown-check.sh --verbose

      - name: bun install
        working-directory: web
        run: bun install --frozen-lockfile

      - name: bun run lint
        working-directory: web
        run: bun run lint

      - name: bun run typecheck
        working-directory: web
        run: bun run typecheck

      - name: bun run test
        working-directory: web
        run: bun run test

      # PLAN §5 acceptance: 100% lines on web/src, minus the two generated
      # shadcn primitives named in scripts/coverage-check.ts.
      - name: bun run coverage:check
        working-directory: web
        run: bun run coverage:check

      - name: bun run i18n:check
        working-directory: web
        run: bun run i18n:check

      - name: bun run contrast:check
        working-directory: web
        run: bun run contrast:check

      # The Rust side already diffs docs/openapi.json against the running
      # server. This closes the other half: the TypeScript the UI is typed
      # against must be what that document generates.
      - name: bun run api:check
        working-directory: web
        run: bun run api:check

      - name: bun run build
        working-directory: web
        run: bun run build

      # Playwright runs against the built bundle via `vite preview`, with the
      # API stubbed per test (see web/e2e/api.ts) — no real binary needed.
      - name: Install Playwright chromium
        working-directory: web
        run: bunx playwright install chromium --with-deps

      - name: bun run e2e
        working-directory: web
        run: bun run e2e

  shell:
    name: Shell (shellcheck, shfmt)
    runs-on: ubuntu-26.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install shellcheck and shfmt
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt

      - name: shellcheck
        run: |
          set -euo pipefail
          mapfile -t files < <(find scripts packaging -name '*.sh' 2>/dev/null | sort)
          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "no shell scripts found"
            exit 0
          fi
          shellcheck "${files[@]}"

      - name: shfmt -d
        run: |
          set -euo pipefail
          mapfile -t files < <(find scripts packaging -name '*.sh' 2>/dev/null | sort)
          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "no shell scripts found"
            exit 0
          fi
          shfmt -d -i 2 -ci "${files[@]}"

  size:
    name: Size check
    runs-on: ubuntu-26.04
    needs: rust
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Preinstalled stable (via workflow RUSTUP_TOOLCHAIN) plus the musl
      # cross target — target add only, no second toolchain download.
      # Same outside-checkout drift read as `rust`.
      - name: rustup target add aarch64-unknown-linux-musl
        run: |
          pinned=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          actual=$(cd "$RUNNER_TEMP" && rustup run stable rustc --version | awk '{print $2}')
          if [[ "$actual" != "$pinned" ]]; then
            echo "::error::preinstalled stable is ${actual} but rust-toolchain.toml pins ${pinned}" >&2
            exit 1
          fi
          rustup target add aarch64-unknown-linux-musl

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # PLAN §4.1 budgets are aarch64-unknown-linux-musl, release, stripped.
      # `cargo-zigbuild` + zig cross-compile that target from the x86_64 glibc
      # runner (docs/spikes/00-cross-build.md is the reference for both tools).
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --version 0.23.2 --locked

      # The `ui` row embeds web/dist, so the SPA has to exist before cargo
      # runs. An empty web/dist still compiles — rust-embed just embeds
      # nothing — which would silently turn that budget row into a
      # measurement of the binary without the console.
      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Build the SPA
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build

      # Four budget rows (PLAN §4.1), each built and checked against its own
      # size-baseline.json key before the next build overwrites the binary.
      - name: Build (full default features)
        run: cargo zigbuild --release -p detent --target aarch64-unknown-linux-musl

      - name: size-check (full default features)
        run: scripts/size-check.sh --verbose --key full-default-aarch64-musl target/aarch64-unknown-linux-musl/release/detent

      - name: Build (resolver + web)
        run: cargo zigbuild --release -p detent --target aarch64-unknown-linux-musl --no-default-features --features module-resolver,web,crypto-aws-lc,init-systemd

      - name: size-check (resolver + web)
        run: scripts/size-check.sh --verbose --key resolver-web-aarch64-musl target/aarch64-unknown-linux-musl/release/detent

      - name: Build (full default + embedded console)
        run: cargo zigbuild --release -p detent --target aarch64-unknown-linux-musl --features ui

      - name: size-check (full default + embedded console)
        run: scripts/size-check.sh --verbose --key full-ui-aarch64-musl target/aarch64-unknown-linux-musl/release/detent

      # No crypto feature: main.rs's provider requirement is gated on `web`,
      # so the smallest build does not have to name a TLS backend it will
      # never link. PLAN §4.1 row 3.
      - name: Build (CLI only, no web/acme/update)
        run: cargo zigbuild --release -p detent --target aarch64-unknown-linux-musl --no-default-features --features module-hosts,module-resolver,module-chrony,module-mounts,module-nfs,module-samba,module-dhcp,module-network,init-systemd

      - name: size-check (CLI only)
        run: scripts/size-check.sh --verbose --key cli-aarch64-musl target/aarch64-unknown-linux-musl/release/detent

  pins:
    name: Action pins (SHA + version comment)
    runs-on: ubuntu-26.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Every `uses:` is pinned to a 40-hex SHA with a version comment
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r line; do
            if ! [[ "$line" =~ uses:\ *[^@[:space:]]+@[0-9a-f]{40}\ +\#\ +[^[:space:]] ]]; then
              echo "unpinned or uncommented: $line"
              bad=1
            fi
          done < <(grep -hE '^\s*-?\s*uses:' .github/workflows/*.yml | grep -vE '^\s*#')
          exit "$bad"
