name: Upstream watch

# Compares each module's `upstream.toml` tracked_version against the newest
# upstream release tag (selection rules: scripts/upstream-watch.sh) and opens an
# issue only when the release is newer (PLAN §2.3, Phase 7 acceptance). A manual
# dispatch is always a dry run: it prints the issues that would be opened and
# opens none. Only the schedule opens issues.
# To exercise the issue path, set the repository variable
# `UPSTREAM_WATCH_FAKE_VERSION` to `0.0` and wait for the schedule.

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  watch:
    name: upstream versions
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Self-test tag selection
        run: scripts/upstream-watch.sh selftest

      - name: Check upstream versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAKE_VERSION: ${{ vars.UPSTREAM_WATCH_FAKE_VERSION }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          flags=(--verbose)
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            flags+=(--dryrun)
          fi
          scripts/upstream-watch.sh check "${flags[@]}"
