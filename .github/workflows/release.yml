# Release pipeline for `v*` tags. `workflow_dispatch` runs the build,
# reproducibility and SBOM jobs as a dry run; the publish job only runs for
# tag refs.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      security:
        description: 'Mark this release as security bypass (adds detent-security: true)'
        required: false
        default: false
        type: boolean

# Unlike CI, a release run must never be cancelled mid-publish, so the group
# only serializes runs for the same ref (no cancel-in-progress).
concurrency:
  group: release-${{ github.ref }}

# Least privilege: the top-level default matches ci.yml (read-only). Only the
# jobs that genuinely need more widen it in their own `permissions:` block.
permissions:
  contents: read

env:
  # Exact pin, NOT stable: the published binaries' hashes must be
  # reproducible (rebuild-verify.yml rebuilds hash-for-hash), so the
  # toolchain cannot drift with the runner image. Bump deliberately
  # together with rust-toolchain.toml. The `rust` job's drift step in
  # ci.yml fails closed when preinstalled stable moves past the pin.
  RUST_TOOLCHAIN: "1.98.1"

jobs:
  build:
    name: Build (${{ matrix.target }}, ${{ matrix.leg }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # PLAN §1.6: Linux musl is cross-built with zigbuild; macOS is built
        # natively on the macOS runner (the arm64 runner links the x86_64
        # target with the Xcode toolchain). No macOS signing in v1.
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - aarch64-apple-darwin
          - x86_64-apple-darwin
        # Reproducibility gate (PLAN M3): every target is built twice, on
        # two fresh runners. `release` is the published build; `rebuild`
        # runs without the cargo cache, so a poisoned cache or a
        # non-deterministic build gives a different SHA-256 and the
        # `reproducible` job stops the release.
        leg:
          - release
          - rebuild
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-26.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-26.04
          # MACOSX_DEPLOYMENT_TARGET is rustc's own default for each triple
          # (`rustc --print deployment-target --target <triple>`). Set it
          # so the `cc` crate builds C code (mimalloc, aws-lc) for the same
          # minimum; unset, `cc` uses the runner's SDK version, so the
          # binary would depend on the runner image.
          - target: aarch64-apple-darwin
            runner: macos-latest
            macos-deployment-target: "11.0"
          - target: x86_64-apple-darwin
            runner: macos-latest
            macos-deployment-target: "10.12"
    steps:
      # Block mode. The allow list is what the ci.yml `size` job (same
      # checkout, cache, zig, cargo install and bun steps) reached in audit
      # mode, plus ziglang.org for a zig cache miss (setup-zig tries the
      # community mirrors first, which are blocked, then falls back to
      # ziglang.org; the tarball is minisign-verified either way). GitHub's
      # own domains are also allowed implicitly by harden-runner. Extend the
      # list from the blocked-call annotations; do not fall back to audit.
      - name: Harden Runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: |
            github.com:443
            api.github.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            productionresultssa*.blob.core.windows.net:443
            static.rust-lang.org:443
            index.crates.io:443
            static.crates.io:443
            registry.npmjs.org:443
            ziglang.org:443

      # harden-runner supports GitHub-hosted macOS runners in audit mode
      # only (its README at this pin), so the macOS legs are monitored but
      # not blocked.
      - name: Harden Runner (audit, macOS)
        if: runner.os == 'macOS'
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reproducible builds: the epoch is the last commit time (not wall
      # clock), and absolute paths are remapped out of the binary, so the
      # same tree + toolchain produces byte-identical artifacts. Written to
      # GITHUB_ENV because env values can't run shell expansions inline.
      - name: Record reproducible-build env
        run: |
          set -euo pipefail
          {
            echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)"
            echo "RUSTFLAGS=--remap-path-prefix=$PWD=/src --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo"
          } >> "$GITHUB_ENV"

      # `toolchain` is a required input for this action (it has no
      # rust-toolchain.toml auto-detection of its own); pinned to match
      # rust-toolchain.toml so the cross target lands on the same
      # toolchain `cargo` actually uses.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Cache cargo
        if: matrix.leg == 'release'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # One cache per target; the matrix job would otherwise thrash a
          # single shared cache with two different target dirs.
          key: ${{ matrix.target }}

      - name: Install Zig
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"

      - name: Install cargo-zigbuild
        if: runner.os == 'Linux'
        run: cargo install cargo-zigbuild --version 0.23.2 --locked

      # cargo auditable wraps any cargo build subcommand (zigbuild included)
      # and embeds the dependency list into the binary, so `cargo audit bin`
      # works against released artifacts.
      - name: Install cargo-auditable
        run: cargo install cargo-auditable --version 0.7.5 --locked

      # The `ui` feature embeds web/dist via rust-embed, so the SPA has to
      # exist before cargo runs — same ordering as the `size` job in ci.yml
      # (an empty web/dist still compiles and would silently ship a binary
      # without the console).
      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Build the SPA
        working-directory: web
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run build

      - name: Build detent (release, ${{ matrix.target }})
        if: runner.os == 'Linux'
        run: cargo auditable zigbuild --release --locked -p detent --target ${{ matrix.target }} --features ui

      # Same flags and features as the Linux build; plain `build` because
      # the macOS targets need no cross linker.
      - name: Build detent (release, ${{ matrix.target }}, macOS)
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos-deployment-target }}
        run: cargo auditable build --release --locked -p detent --target ${{ matrix.target }} --features ui

      - name: Stage release assets
        run: |
          set -euo pipefail
          # The binary keeps its target triple in the name so the publish job
          # can merge all matrix artifacts into one directory without
          # collisions.
          mkdir -p release/${{ matrix.target }}
          cp target/${{ matrix.target }}/release/detent \
            release/${{ matrix.target }}/detent-${{ matrix.target }}

      # The publish job downloads `release-*` only; `rebuild-*` is for the
      # reproducibility gate.
      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.leg }}-${{ matrix.target }}
          path: release/${{ matrix.target }}/
          retention-days: 14

  reproducible:
    name: Reproducibility gate (two builds, SHA-256)
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      # Block mode; this job only downloads artifacts.
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: |
            api.github.com:443
            results-receiver.actions.githubusercontent.com:443
            productionresultssa*.blob.core.windows.net:443

      - name: Download release builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      - name: Download rebuilds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rebuild-*
          merge-multiple: true
          path: rebuild

      # diff exits non-zero if a target is missing from one side or its
      # two builds have different SHA-256s.
      - name: Compare SHA-256 of both builds
        run: |
          set -euo pipefail
          (cd release && sha256sum detent-*) | LC_ALL=C sort > release.sums
          (cd rebuild && sha256sum detent-*) | LC_ALL=C sort > rebuild.sums
          cat release.sums
          diff -u release.sums rebuild.sums

  sbom:
    name: SBOM (cargo + web, merged CycloneDX)
    runs-on: ubuntu-26.04
    steps:
      # Block mode; same sources as the build job less zig. cdxgen runs
      # through bunx from registry.npmjs.org.
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: |
            github.com:443
            api.github.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            productionresultssa*.blob.core.windows.net:443
            static.rust-lang.org:443
            index.crates.io:443
            static.crates.io:443
            registry.npmjs.org:443

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same reproducible-build env as the build job; cargo-cyclonedx embeds
      # timestamps, so SOURCE_DATE_EPOCH keeps the SBOM deterministic too.
      - name: Record reproducible-build env
        run: |
          set -euo pipefail
          echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      # SBOM enumerates the dependency graph of the pinned toolchain's
      # build; use the exact pin, not drifting stable.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: sbom

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked

      # Emits one bom.json per workspace crate next to its Cargo.toml.
      # `--target all` so target-specific dependencies of every release
      # triple are described, not just the host's.
      - name: cargo cyclonedx (Rust workspace)
        run: cargo cyclonedx --format json --spec-version 1.5 --target all

      # Runs from web/bun.lock only (no node_modules at release time); cdxgen
      # detects the Bun lockfile and produces a CycloneDX 1.5 JSON. Version is
      # pinned (12.8.4, published 2026-08-18) to honor the ADR-011 cooldown.
      - name: cdxgen (web SPA)
        run: bunx @cyclonedx/cdxgen@12.8.4 --spec-version 1.5 -o bom-web.json web

      # cargo-cyclonedx writes every crate's SBOM as `bom.json`, so the files
      # are collected under unique names (sorted for deterministic merge
      # order) before the union below.
      - name: Merge SBOMs into SBOM.cyclonedx.json
        run: |
          set -euo pipefail
          mkdir sboms
          i=0
          while IFS= read -r f; do
            cp "$f" "sboms/rust-${i}.json"
            i=$((i + 1))
          done < <(find . -name bom.json -not -path './web/*' | LC_ALL=C sort)
          mv bom-web.json sboms/web.json
          # Union merge: keep the first SBOM's metadata/serial and union the
          # components + dependencies. # ponytail: good enough for
          # attestation; swap for `cyclonedx-cli merge` if a spec-strict
          # consumer shows up.
          jq -s '
            {
              "$schema": "http://cyclonedx.org/schema/bom-1.5.schema.json",
              "bomFormat": "CycloneDX",
              "specVersion": "1.5",
              "serialNumber": .[0].serialNumber,
              "version": 1,
              "metadata": .[0].metadata,
              "components": ([.[].components[]] | unique_by(.bom-ref // .name)),
              "dependencies": ([.[].dependencies[]?] | unique_by(.ref))
            }' sboms/*.json > SBOM.cyclonedx.json
          jq -e '.bomFormat == "CycloneDX" and (.components | length > 0)' SBOM.cyclonedx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: SBOM.cyclonedx.json
          retention-days: 14

  publish:
    name: Publish release (SHA256SUMS, attestations, GitHub Release)
    needs: [build, reproducible, sbom]
    # workflow_dispatch from a branch is a dry run: build, gate and SBOM only.
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-26.04
    permissions:
      contents: write      # create the GitHub Release and upload assets
      id-token: write      # attestation signing (actions/attest*)
      attestations: write  # actions/attest* store attestations on the repo
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          # The one job with write access runs in block mode. The allow list
          # is everything `gh release`, artifact download, the attestation
          # store, and keyless Sigstore signing/attesting need (Fulcio cert,
          # Rekor log, TUF roots, RFC3161 timestamp, CT log). harden-runner's
          # audit output on the first release run will call out anything
          # missing — extend the list, do not fall back to audit.
          egress-policy: block
          allowed-endpoints: |
            api.github.com:443
            github.com:443
            *.githubusercontent.com:443
            productionresultssa*.blob.core.windows.net:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-rekor-cdn.sigstore.dev:443
            timestamp.sigstore.dev:443
            ctfe.sigstore.dev:443

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Download SBOM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: dist

      # Contract: SHA256SUMS covers the binaries only. `detent-*` in dist
      # matches exactly the four binaries: the sigstore bundles are written
      # to dist/sigstore/ later and the SBOM has a different name.
      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          for b in detent-*; do sha256sum "$b"; done | LC_ALL=C sort > SHA256SUMS
          cat SHA256SUMS

      # Build provenance for each binary. The attestation identity is the
      # workflow's OIDC SAN (ADR-005):
      #   https://github.com/jauderho/detent/.github/workflows/release.yml@refs/tags/<tag>
      # with issuer https://token.actions.githubusercontent.com.
      - name: Attest binaries (build provenance)
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/detent-*

      # The self-updater verifies this DSSE bundle (ADR-014), fetched as
      # detent-<triple>.sigstore.json. One attestation covers all binaries
      # as its subjects; the verifier accepts it because it requires exactly
      # one subject with the downloaded file's digest
      # (crates/detent-update/src/verify.rs, step 5), so the same bundle is
      # copied under each binary's name.
      - name: Stage sigstore bundles
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          mkdir -p dist/sigstore
          for b in dist/detent-*; do
            cp "$BUNDLE_PATH" "dist/sigstore/$(basename "$b").sigstore.json"
          done
          ls -l dist/sigstore

      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          sbom-path: dist/SBOM.cyclonedx.json
          subject-path: dist/detent-*

      - name: Refuse accidental security marker in generated notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes=$(gh api repos/${{ github.repository }}/releases/generate-notes --field tag_name="$GITHUB_REF_NAME" --jq .body)
          if printf '%s\n' "$notes" | grep -qx 'detent-security: true'; then
            if [ "${{ inputs.security }}" != "true" ]; then
              echo "::error::generated notes contain detent-security: true without workflow input security=true" >&2
              echo "$notes" >&2
              exit 1
            fi
          fi

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # --verify-tag refuses to publish if the tag is not on the remote,
          # so a mistagged dry run can never create a phantom release.
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            dist/detent-* \
            dist/sigstore/*.json \
            dist/SHA256SUMS \
            dist/SBOM.cyclonedx.json
