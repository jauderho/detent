name: Fuzz

# No pull_request trigger (owner decision 2026-10-14: CI is too slow): fuzzing
# runs on push to main, nightly and by hand, like the other heavy jobs in
# ci.yml.
on:
  push:
    branches:
      - main
    paths:
      - "crates/**"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

env:
  RUSTUP_TOOLCHAIN: nightly

jobs:
  fuzz:
    name: cargo-fuzz
    runs-on: ubuntu-26.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same pinned action as ci.yml, with `nightly` asked for by input.
      # The previous pin was a SHA that does not exist in this repository, so
      # the step could never have resolved.
      - name: Install nightly Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-fuzz@0.13.2

      - name: Run fuzz targets
        env:
          MAX_TOTAL_TIME: ${{ github.event_name == 'schedule' && '1200' || '60' }}
        run: |
          set -euo pipefail
          # fuzz/Cargo.toml exists from Phase 1 onward, but `cargo fuzz build`
          # fails until at least one target is registered; guard on the
          # presence of a fuzz_targets/*.rs file rather than the manifest.
          if ! compgen -G "fuzz/fuzz_targets/*.rs" >/dev/null; then
            echo "no fuzz targets yet"
            exit 0
          fi
          targets="$(cargo fuzz list)"
          if [[ -z "${targets}" ]]; then
            echo "no fuzz targets yet"
            exit 0
          fi
          status=0
          # `cargo-fuzz` is distributed as a musl-static binary, so its
          # compiled-in default `--target` is `x86_64-unknown-linux-musl`,
          # whose statically linked libc rejects `-Zsanitizer=address`.
          # Override to gnu: the runner's nightly has that std preinstalled.
          while IFS= read -r target; do
            [[ -z "${target}" ]] && continue
            echo "::group::fuzz target: ${target}"
            if ! cargo fuzz run --target=x86_64-unknown-linux-gnu "${target}" -- "-max_total_time=${MAX_TOTAL_TIME}"; then
              status=1
            fi
            echo "::endgroup::"
          done <<< "${targets}"
          exit "${status}"

      - name: Upload fuzz artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          retention-days: 14
          if-no-files-found: ignore
