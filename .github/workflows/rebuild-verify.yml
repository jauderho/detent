# Rebuild Verify — weekly supply-chain tripwire.
#
# Rebuilds the latest `v*` release from its exact source with the SAME
# reproducible flags as release.yml and compares the resulting binaries,
# hash-for-hash, against the published release assets. Also re-verifies the
# sigstore attestation on each published binary. Any drift (tampered asset,
# non-reproducible build, renamed asset) fails the job.
#
# Asset-name contract (MUST match release.yml):
#   detent-<triple>             release binary (copied from target/<triple>/release/detent)
#   detent-<triple>.sigstore.json
#   SHA256SUMS                  top-level; covers all detent-<triple> binaries
#   SBOM.cyclonedx.json
# where <triple> ∈ {x86_64-unknown-linux-musl, aarch64-unknown-linux-musl,
# aarch64-apple-darwin, x86_64-apple-darwin}.
#
# The macOS legs build on macos-latest, as release.yml did. A later runner
# image (Xcode SDK) can change the bytes; a red macOS leg alone means check
# the image first.
#
# `gh attestation verify` checks the actions/attest attestation in GitHub's
# attestation store, not the detent-<triple>.sigstore.json asset (since the
# Rekor v2 switch that asset is a cosign bundle; release.yml gates it).
#
# Attestation identity (ADR-005): the published bundles must have been signed
# by the release workflow, SAN
#   https://github.com/jauderho/detent/.github/workflows/release.yml@refs/tags/<tag>
# with issuer https://token.actions.githubusercontent.com.

name: Rebuild Verify

on:
  schedule:
    # Weekly, Mondays 09:00 UTC.
    - cron: "0 9 * * 1"
  workflow_dispatch:

# Read-only job: checkouts, builds, `gh release download`, and
# `gh attestation verify` need nothing beyond read access. `attestations:
# read` is the minimum permission the attestation API accepts for
# `gh attestation verify`; contents:read covers everything else.
permissions:
  contents: read
  attestations: read

env:
  # Exact pin, NOT stable: this job rebuilds a published release
  # hash-for-hash, so it must use the same toolchain release.yml did.
  # The checked-out tag carries its own rust-toolchain.toml; bump this
  # alongside that file on deliberate upgrades.
  RUST_TOOLCHAIN: "1.98.1"

jobs:
  rebuild-verify:
    name: Rebuild ${{ matrix.target }} vs published release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # Same targets, runners and deployment targets as release.yml's build
      # job.
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-26.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-26.04
          - target: aarch64-apple-darwin
            runner: macos-latest
            macos-deployment-target: "11.0"
          - target: x86_64-apple-darwin
            runner: macos-latest
            macos-deployment-target: "10.12"
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # Full history so the release tag is available.
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The tag is GitHub's latest release (never a draft or pre-release,
      # so never a test tag such as v0.1.1-test). Reproducible builds — same
      # env as release.yml's build job: the epoch is the tag commit's time
      # (not wall clock) and absolute paths are remapped out of the binary.
      # The tag must be checked out first so git log -1 reads the released
      # tree, not main.
      - name: Resolve the latest release and check it out
        run: |
          set -euo pipefail
          TAG=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          git checkout "$TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          {
            echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)"
            echo "RUSTFLAGS=--remap-path-prefix=$PWD=/src --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo"
          } >> "$GITHUB_ENV"
          echo "verifying $TAG"

      # Same versioned install as release.yml's build job, so the target
      # lands on the toolchain `cargo` actually uses.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      # No cargo cache, as in release.yml: cargo does not rebuild a C
      # dependency when SOURCE_DATE_EPOCH changes, so a cached mimalloc
      # object would keep another commit's __TIME__.

      - name: Install Zig
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"

      - name: Install cargo-zigbuild
        if: runner.os == 'Linux'
        run: cargo install cargo-zigbuild --version 0.23.2 --locked

      - name: Install cargo-auditable
        run: cargo install cargo-auditable --version 0.7.5 --locked

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # The ui feature rust-embeds web/dist, so the SPA has to exist before
      # cargo runs (an empty web/dist would compile a binary with no console).
      - name: Build the SPA
        working-directory: web
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run build

      # Identical commands to release.yml's build steps — a reviewer diffs
      # these; any drift breaks byte-reproducibility.
      - name: Rebuild detent (release, ${{ matrix.target }})
        if: runner.os == 'Linux'
        run: cargo auditable zigbuild --release --locked -p detent --target ${{ matrix.target }} --features ui

      - name: Rebuild detent (release, ${{ matrix.target }}, macOS)
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos-deployment-target }}
        run: cargo auditable build --release --locked -p detent --target ${{ matrix.target }} --features ui

      - name: Download published release assets
        run: |
          set -euo pipefail
          mkdir published
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" --dir published \
            --pattern "detent-${{ matrix.target }}" \
            --pattern "SHA256SUMS"

      # The published asset and the rebuilt binary must both match the
      # published SHA256SUMS entry for this target. A tampered asset, a
      # non-reproducible build or a missing entry fails here.
      - name: Compare the rebuild with the published release
        env:
          ASSET: detent-${{ matrix.target }}
        run: |
          set -euo pipefail
          expected=$(awk -v name="$ASSET" '$2 == name { print $1 }' published/SHA256SUMS)
          if [[ -z "$expected" ]]; then
            echo "::error::SHA256SUMS has no entry for $ASSET" >&2
            exit 1
          fi
          published=$(shasum -a 256 "published/$ASSET" | cut -d' ' -f1)
          rebuilt=$(shasum -a 256 "target/${{ matrix.target }}/release/detent" | cut -d' ' -f1)
          echo "SHA256SUMS $expected"
          echo "published  $published"
          echo "rebuilt    $rebuilt"
          if [[ "$published" != "$expected" || "$rebuilt" != "$expected" ]]; then
            echo "::error::$ASSET does not match SHA256SUMS for $TAG" >&2
            exit 1
          fi

      - name: Verify release attestation
        run: |
          gh attestation verify "published/detent-${{ matrix.target }}" -R "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "refs/tags/$TAG"
