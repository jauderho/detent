<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>detent</title>
    <!-- The body of this script must stay byte-identical to
         src/theme-init.js: the CSP in detent-web/src/headers.rs pins its
         SHA-256, and a `sha256-` hash covers the element's text content
         exactly, indentation included. Hence the flush-left body, and the
         test that fails when the two drift apart. -->
    <script>;(() => {
  let s
  try {
    s = localStorage.getItem('detent-theme')
    if (s !== 'light' && s !== 'dark') {
      // Dark is the documented default (AGENTS.md), not a fallback the OS gets
      // a say in. This must agree with `readTheme()` in src/lib/theme.ts: this
      // script paints the first frame and that function decides every frame
      // after it, so a disagreement is a visible flash of the wrong theme.
      s = 'dark'
    }
    document.documentElement.setAttribute('data-theme', s)
  } catch {
    document.documentElement.setAttribute('data-theme', 'dark')
  }
})()
</script>
    <meta name="description" content="detent — config console" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
