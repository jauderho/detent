<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>detent</title>
    <!-- The body of this script must stay byte-identical to
         src/theme-init.js: the CSP in detent-web/src/headers.rs pins its
         SHA-256, and a `sha256-` hash covers the element's text content
         exactly, indentation included. Hence the flush-left body, and the
         test that fails when the two drift apart. -->
    <script>;(() => {
  let s
  try {
    s = localStorage.getItem('detent-theme')
    if (!s) {
      s = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
    }
    document.documentElement.setAttribute('data-theme', s)
  } catch {
    document.documentElement.setAttribute('data-theme', 'dark')
  }
})()
</script>
    <meta name="description" content="detent — config console" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
