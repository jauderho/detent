# This is the network config written by 'subiquity'
network:
  version: 2
  renderer: networkd
  ethernets:
    eth0:
      match:
        macaddress: "52:54:00:12:34:56"
      set-name: eth0
      dhcp4: false
      dhcp6: false
      addresses:
        - 192.0.2.10/24
      nameservers:
        search:
          - example.com
        addresses: [192.0.2.53]
      routes:
        - to: default
          via: 192.0.2.1
          metric: 100
      optional: true
  bonds:
    bond0:
      interfaces: [eth0]
