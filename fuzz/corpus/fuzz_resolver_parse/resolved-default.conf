# /etc/systemd/resolved.conf — Debian's shipped file, systemd 257:
# nearly everything commented, the two lines systemd uncommented in newer
# releases kept as they appear, plus hand-added DNS with an auth name.
# See resolved.conf(5); the modeled subset is DNS, DNSSEC, DNSOverTLS, Domains.
[Resolve]
#DNS=
#FallbackDNS=
#Domains=
#DNSSEC=no
#DNSOverTLS=no
DNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net
DNSSEC=allow-downgrade
DNSOverTLS=opportunistic
