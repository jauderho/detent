// hand-made edge fixture: trailing commas, as in the stock Debian and Ubuntu
// kea-dhcp4.conf, which Kea accepts
{
  "Dhcp4": {
    "interfaces-config": {
      "interfaces": [ "eth0", ],
    },
    "valid-lifetime": 3600,
    "subnet4": [
      {
        "id": 1,
        "subnet": "192.168.1.0/24",
        "pools": [ { "pool": "192.168.1.100 - 192.168.1.200" } ],
      },
    ],
    "loggers": [
      {
        "name": "kea-dhcp4",
        "output-options": [
          {
            "output": "stdout",
            "pattern": "%-5p %m\n",
            // "maxsize": 1048576,
          },
        ],
        "severity": "INFO",
      },
    ],
  },
}
