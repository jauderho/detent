[package]
name = "detent-fuzz"
version = "0.0.1"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
axum = "0.8"
serde = "1"
serde_json = "1"
detent-core = { path = "../crates/detent-core", features = ["fuzzing"] }
detent-module-hosts = { path = "../crates/modules/hosts", features = ["fuzzing"] }
detent-module-resolver = { path = "../crates/modules/resolver", features = ["fuzzing"] }
detent-module-chrony = { path = "../crates/modules/chrony", features = ["fuzzing"] }
detent-module-mounts = { path = "../crates/modules/mounts", features = ["fuzzing"] }
detent-module-nfs = { path = "../crates/modules/nfs", features = ["fuzzing"] }
detent-module-samba = { path = "../crates/modules/samba", features = ["fuzzing"] }
detent-module-dhcp = { path = "../crates/modules/dhcp", features = ["fuzzing"] }
detent-module-network = { path = "../crates/modules/network", features = ["fuzzing"] }
detent-platform = { path = "../crates/detent-platform", features = ["fuzzing"] }
detent-web = { path = "../crates/detent-web" }

[profile.release]
debug = 1

[[bin]]
name = "fuzz_hosts_parse"
path = "fuzz_targets/fuzz_hosts_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_hosts_roundtrip"
path = "fuzz_targets/fuzz_hosts_roundtrip.rs"
test = false
doc = false
bench = false

