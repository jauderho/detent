[package]
name = "detent-fuzz"
version = "0.0.1"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
serde = "1"
detent-core = { path = "../crates/detent-core", features = ["fuzzing"] }
detent-module-hosts = { path = "../crates/modules/hosts", features = ["fuzzing"] }
detent-platform = { path = "../crates/detent-platform", features = ["fuzzing"] }

[profile.release]
debug = 1

[[bin]]
name = "fuzz_hosts_parse"
path = "fuzz_targets/fuzz_hosts_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_hosts_roundtrip"
path = "fuzz_targets/fuzz_hosts_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_hosts_edit"
path = "fuzz_targets/fuzz_hosts_edit.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_privsep_decode"
path = "fuzz_targets/fuzz_privsep_decode.rs"
test = false
doc = false
bench = false
