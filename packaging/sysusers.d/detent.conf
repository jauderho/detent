# packaging/sysusers.d/detent.conf
#
# Creates the unprivileged `detent` system user that the worker process
# (both privilege modes) and the monitor itself (capability-user mode,
# PLAN §2.4) run as. Applied by `systemd-sysusers` — install.sh runs this
# automatically outside --prefix/--dryrun mode; DESTDIR-style packaging
# should invoke it separately (`systemd-sysusers --root=<prefix>`).
#
# Type Name    ID  GECOS                          Home directory   Shell
u      detent  -   "detent config management daemon" /var/lib/detent /usr/sbin/nologin
