# packaging/tmpfiles.d/detent.conf
#
# Creates and enforces ownership/mode of detent's state directories
# (PLAN §2.10). Applied by `systemd-tmpfiles --create` — install.sh runs
# this automatically outside --prefix/--dryrun mode; DESTDIR-style
# packaging should invoke it separately
# (`systemd-tmpfiles --create --root=<prefix>`).
#
# /var/lib/detent           worker-writable state (certs/, state/, sessions/, audit/)
# /var/lib/detent/backups   monitor-only; never readable/writable by the worker
# /run/detent               monitor-only runtime base
# /run/detent/staging       monitor-owned materialized update images
# /etc/detent               config; group `detent` gets read access for `detent doctor`
#                            and similar tooling, root keeps write access
#
# Type Path                     Mode  User   Group   Age  Argument
d      /var/lib/detent           0700  detent detent  -    -
d      /var/lib/detent/backups   0700  root   root    -    -
d      /run/detent               0700  root   root    -    -
d      /run/detent/staging       0700  root   root    -    -
d      /etc/detent               0750  root   detent  -    -
