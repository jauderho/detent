# packaging/systemd/detent.service.d/capability-user.conf
#
# Phase 12 hardened mode drop-in (privilege.mode = "capability-user", PLAN
# §2.4). Install alongside packaging/systemd/detent.service with
# `install.sh --mode capability-user`. In this mode the monitor never runs
# as root: it runs as the unprivileged `detent` user, retaining only the
# ambient capabilities it needs to take ownership of target files. Service
# control (starting/restarting chronyd, smbd, etc.) goes through the polkit
# rule in packaging/polkit/50-detent.rules instead of a root D-Bus call.
#
# CapabilityBoundingSet= and AmbientCapabilities= are list-type directives:
# a systemd drop-in normally ADDS to a list the base unit already set rather
# than replacing it. Both are therefore reset with an empty assignment
# before the reduced set is applied below — without the reset,
# CAP_SETUID/CAP_SETGID/CAP_KILL from detent.service's CapabilityBoundingSet=
# would still be present in the merged unit. CAP_SETUID/CAP_SETGID are
# dropped entirely here: the monitor is already uid detent, so it never
# needs to change identity the way the root-confined monitor does to spawn
# the worker.
[Service]
User=detent
Group=detent
CapabilityBoundingSet=
CapabilityBoundingSet=CAP_DAC_OVERRIDE CAP_CHOWN CAP_FOWNER
AmbientCapabilities=
AmbientCapabilities=CAP_DAC_OVERRIDE CAP_CHOWN CAP_FOWNER
# Only takes effect for a non-root User=; systemd-analyze reports it as
# inapplicable ("option does not apply") in the root-confined unit, so it is
# not set there.
RemoveIPC=yes
# tmpfiles creates the runtime tree root-owned for the default monitor. In
# capability-user mode the monitor runs as detent, so hand it the private tree
# before the sandbox starts; the monitor still enforces euid ownership.
ExecStartPre=+/usr/bin/chown detent:detent /run/detent /run/detent/staging
