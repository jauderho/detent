[advisories]
yanked = "deny"
unmaintained = "all"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Zlib",
    "Unicode-3.0",
    "OpenSSL",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Intra-workspace path dependencies (the module crates optionally pulled in by
# `crates/detent`) have no `version` field since they are never published; that
# is expected and not the "unpinned dependency" problem `wildcards` guards
# against.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
