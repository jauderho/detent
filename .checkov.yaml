# Checkov configuration, read by super-linter (.github/workflows/linter.yml).
skip-check:
  # Wants `maxItems` on every array response in docs/openapi.json. The arrays
  # are bounded server-side (MAX_AUDIT_LIMIT; the module registry is fixed at
  # compile time), but that document is generated by utoipa from the handler
  # attributes, and utoipa can only put `maxItems` on a named schema, not on a
  # response body. Satisfying it would mean a newtype per endpoint existing
  # solely to carry the annotation.
  - CKV_OPENAPI_21
  # Flags any operation with `security: []`. That is the standard way to mark
  # an operation as deliberately public, and detent has exactly two: `/healthz`
  # (a liveness probe has no credential) and `/api/v1/openapi.json` (a front
  # end needs the document before it has a session). The check cannot tell
  # "explicitly public" from "forgot to set security", and the alternative is a
  # document that claims those endpoints are authenticated when they are not.
  - CKV_OPENAPI_5
