[workspace]
resolver = "3"
# NOTE: "crates/*" cannot be used verbatim together with "crates/modules/*":
# glob member expansion requires every matched directory to contain its own
# Cargo.toml, and `crates/modules/` is a plain container (no manifest) for the
# nested module crates. Listing top-level crates explicitly avoids that glob
# collision while keeping `crates/modules/*` as a glob for the module crates.
members = [
    "crates/detent-core",
    "crates/detent-modules",
    "crates/detent-platform",
    "crates/detent-ops",
    "crates/detent-acme",
    "crates/detent-update",
    "crates/detent-web",
    "crates/detent-i18n",
    "crates/detent-ffi",
    "crates/detent-mcp",
    "crates/detent",
    "crates/modules/*",
]
# The copy-me skeleton stays in the module glob so workspace builds keep its
# examples compiling as they evolve.
exclude = ["spikes", "fuzz", "web"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
license = "BSD-3-Clause"
repository = "https://github.com/jauderho/detent"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "warn"
multiple_crate_versions = "allow"

[workspace.dependencies]
mimalloc = { version = "0.1.52", features = ["secure"] }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
serde = { version = "1.0.229", features = ["derive"] }
caps = "0.5.6"
fluent-bundle = "0.16.0"
landlock = "0.4.7"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
seccompiler = "0.5.0"
serde_json = "1.0.151"
schemars = "1.2.2"
arbitrary = { version = "1.4.2", features = ["derive"] }
proptest = "1.11.0"
rustix = { version = "1.1.4", default-features = false, features = ["fs", "process", "std"] }
sha2 = "0.11.0"
# `parsing`: detent-update reads RFC 3339 timestamps out of GitHub release
# metadata (`published_at`); formatting alone cannot round-trip them.
time = { version = "0.3", default-features = false, features = ["std", "formatting", "macros", "parsing"] }
xattr = "1.6.1"
tempfile = "3.27.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
unic-langid = "0.9.6"

# Web front (PLAN §2.6, §2.7). Every entry here is pinned to the newest release
# that clears the 7-day cooldown of §6.4; do not bump one without re-checking
# its publication date.
# `argon2` 0.6 has no `std` feature; `alloc` + `password-hash` is the whole of
# the PHC-string API, `getrandom` supplies the per-hash salt without pulling a
# `rand` stack, and `zeroize` wipes the hashing memory blocks after use.
argon2 = { version = "0.6.0", default-features = false, features = [
    "alloc",
    "getrandom",
    "password-hash",
    "zeroize",
] }
axum = "0.8.9"
# TOTP only (RFC 6238), and only together with `sha1`. `hmac` 0.13 and `sha1`
# 0.11 are on `digest` 0.11 while the rest of the workspace hashes with `sha2`
# 0.10 (`digest` 0.10); the duplication is deliberate and tolerated by
# `multiple_crate_versions = "allow"`.
hmac = "0.13.0"
getrandom = "0.4.3"
hyper = { version = "1.11.1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.20", features = [
    "server-auto",
    "server-graceful",
    "service",
    "tokio",
] }
# `default-features = false`: rcgen's defaults link `ring` even in an aws-lc
# build (PLAN §4.2), and CI asserts `cargo tree -i ring` is empty by default.
rcgen = { version = "0.14.10", default-features = false, features = ["crypto"] }
# Embeds `web/dist` behind detent-web's `ui` feature (PLAN §2.6, §4.2), off
# by default until Phase 5 gives that directory something to embed.
rust-embed = { version = "8.12.0", features = ["include-exclude"] }
# No `tls12`: TLS 1.2 is not compiled into the shipped binary at all (§2.7).
rustls = { version = "0.23.45", default-features = false, features = [
    "logging",
    "std",
] }
# SHA-1 is here for one reason: RFC 6238 and every authenticator application
# speak HMAC-SHA1. Nothing else in this workspace may use it.
sha1 = "0.11.0"
subtle = "2.6.1"
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "net",
    "time",
    "sync",
    "macros",
    "io-util",
    "signal",
] }
tokio-rustls = { version = "0.26.4", default-features = false }
toml = { version = "1.1.4", default-features = false, features = [
    "parse",
    "serde",
    "std",
] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["timeout"] }
# OpenAPI document for `/api/v1` (PLAN §2.6). `axum_extras` gives
# `#[utoipa::path]` `Path`/`Query` parameter extraction from axum's own
# types, which is all this crate needs; `utoipa-axum` is deliberately not
# pulled in on top of it (routes are still registered by hand).
utoipa = { version = "5.5.0", features = ["axum_extras"] }
zeroize = "1.9.0"

# Self-update verifier (PLAN §2.9, ADR-014). Everything here already exists in
# the lock via other crates except `p256`/`webpki-roots`; no new HTTP stack
# (ADR-009), no `sigstore` crate (spike 01).
# `p256`'s `ecdsa` feature lands on `ecdsa`/`digest` 0.16/0.10 — the same
# `digest` 0.10 generation as the workspace `sha2`, so no hash-stack split.
p256 = { version = "0.13.2", features = ["ecdsa"] }
# Leaf SAN and Fulcio OIDC-issuer-extension extraction; the chain verification
# itself is `webpki` (package `rustls-webpki`, ADR-014: rustls/webpki, already
# in the tree).
x509-parser = "0.18.1"
webpki = { version = "0.103.15", package = "rustls-webpki", default-features = false, features = [
    "std",
    "aws-lc-rs",
] }
# Certificate DER types shared with rustls (`webpki`'s public API is typed in
# them); already in the lock via rustls.
rustls-pki-types = "1.15.1"
# GitHub API + binary download over the workspace TLS 1.3 stack. No `tls12`,
# matching the shipped client posture (§2.7); no native-certs, no
# platform-verifier: the update path trusts only webpki-roots at build time.
http-body-util = "0.1.5"
hyper-rustls = { version = "0.27.9", default-features = false, features = [
    "http1",
    "aws-lc-rs",
] }
webpki-roots = "1.0.4"
# Release tag comparison (§2.9 step 2). Already in the lock transitively.
semver = "1.0.28"
# Bundle/base64 decoding. Already in the lock transitively.
base64 = "0.22.1"

# Dependencies build without debug info. This workspace's own crates keep
# full debug info, so backtraces and stepping through detent code are
# unchanged, while target/debug shrinks by most of its size (third-party
# debug info dominates it) and debug builds link faster.
[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
overflow-checks = true

[profile.release.package."*"]
opt-level = "z"
